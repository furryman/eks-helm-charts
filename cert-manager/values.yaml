cert-manager:
  crds:
    enabled: true
  prometheus:
    enabled: false
  # Gateway API support graduated from feature gate to controller flag
  # in cert-manager 1.16+. Required for the ClusterIssuer's
  # gatewayHTTPRoute solver; without it cert-manager logs
  # "gateway api is not enabled" and challenges sit pending forever.
  extraArgs:
    - --enable-gateway-api

# Let's Encrypt configuration
letsencrypt:
  email: admin@fuhriman.org
  server: https://acme-v02.api.letsencrypt.org/directory

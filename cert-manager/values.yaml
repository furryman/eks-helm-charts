cert-manager:
  installCRDs: true
  prometheus:
    enabled: false
  # cert-manager 1.14 ships Gateway API support behind a feature gate. 1.15+
  # makes it stable; once we bump the chart in Phase 5+, this can be removed.
  featureGates: "ExperimentalGatewayAPISupport=true"

# Let's Encrypt configuration
letsencrypt:
  email: admin@fuhriman.org
  server: https://acme-v02.api.letsencrypt.org/directory

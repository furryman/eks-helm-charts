envoy-gateway:
  # PR-A: controller-only deployment. No GatewayClass, no Gateway resources yet —
  # those land in PR-B alongside the HTTPRoute migration so the cutover is atomic.

  # Resource hints — Envoy Gateway controller is light at this scale.
  deployment:
    envoyGateway:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

  # Don't expose Prometheus metrics — no Prometheus deployed.
  config:
    envoyGateway:
      telemetry:
        metrics:
          prometheus:
            disable: true

# ArgoCD UI exposed at https://argocd.fuhriman.org via the shared "public"
# Gateway. ArgoCD server runs with --insecure (configured in user_data.sh's
# helm install args); TLS terminates at the Gateway with the multi-SAN
# fuhriman-tls cert.
#
# Lives in this chart (instead of argocd-app-of-apps) so it's deployed AFTER
# envoy-gateway installs the Gateway API CRDs — avoids a chicken-and-egg on
# first cluster boot.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - argocd.fuhriman.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80

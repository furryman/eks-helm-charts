replicaCount: 1
image:
  repository: furryman/fuhriman-website
  tag: ga-2026.05.23-0155
  pullPolicy: Always
service:
  type: ClusterIP
  port: 80

# Phase 4 PR-B: routing migrated from Ingress (ingress-nginx) to Gateway API
# (Envoy Gateway). The shared "public" Gateway in envoy-gateway-system holds
# the cert annotations + the external-dns target override — this chart just
# declares hostnames and the HTTPRoute attaches to the Gateway.
routing:
  enabled: true
  hostnames:
    - fuhriman.org
    - www.fuhriman.org
  gateway:
    name: public
    namespace: envoy-gateway-system

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
nodeSelector: {}
tolerations: []
affinity: {}

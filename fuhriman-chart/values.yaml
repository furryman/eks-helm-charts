replicaCount: 1
image:
  repository: furryman/fuhriman-website
  tag: ga-2026.05.22-2306
  pullPolicy: Always
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ExternalDNS publishes these hostnames to Route53. Hostnames here are
    # redundant with the `hosts[].host` field below (ExternalDNS reads both)
    # but the explicit annotation makes the intent obvious.
    external-dns.alpha.kubernetes.io/hostname: fuhriman.org,www.fuhriman.org
    # Override the target — klipper-lb on k3s reports the node's private IP in
    # the Ingress LB status, which would publish bogus records. This forces
    # ExternalDNS to use the instance's public IP. Bump this value when an EIP
    # is attached (Phase 3.5 / before NS cutover).
    external-dns.alpha.kubernetes.io/target: "35.86.95.174"
  hosts:
    - host: fuhriman.org
      paths:
        - path: /
          pathType: Prefix
    - host: www.fuhriman.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: fuhriman-tls
      hosts:
        - fuhriman.org
        - www.fuhriman.org
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
nodeSelector: {}
tolerations: []
affinity: {}

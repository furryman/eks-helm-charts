replicaCount: 1
image:
  repository: furryman/fuhriman-website
  tag: ga-2026.05.23-0155
  pullPolicy: Always
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ExternalDNS publishes these hostnames to Route53. Hostnames here are
    # redundant with the `hosts[].host` field below (ExternalDNS reads both)
    # but the explicit annotation makes the intent obvious.
    external-dns.alpha.kubernetes.io/hostname: fuhriman.org,www.fuhriman.org
    # Target = Elastic IP (allocated in Phase 3.5). Stable across instance
    # stop/start and replacement. Klipper-lb's reported node-internal IP is
    # overridden by this value.
    external-dns.alpha.kubernetes.io/target: "52.37.95.130"
  hosts:
    - host: fuhriman.org
      paths:
        - path: /
          pathType: Prefix
    - host: www.fuhriman.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: fuhriman-tls
      hosts:
        - fuhriman.org
        - www.fuhriman.org
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
nodeSelector: {}
tolerations: []
affinity: {}
